<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mur - Mini Jeu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .game-container {
            display: flex;
            gap: 20px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        canvas {
            background: #090d16;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #334155;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 250px;
        }
        .panel {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .panel h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #cbd5e1;
        }
        .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
        }
        .balls-left {
            font-size: 1.5rem;
            font-weight: bold;
            color: #facc15;
        }
        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 10px;
        }
        .tab-btn {
            flex: 1;
            padding: 6px;
            font-size: 0.8rem;
            background: #475569;
        }
        .tab-btn.active {
            background: #3b82f6;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.9rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
            margin-top: 5px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .instructions {
            font-size: 0.8rem;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>LE MUR</h1>
    <p style="margin-top: 0; color: #94a3b8;">Clique en haut du mur pour lâcher une boule !</p>

    <div class="game-container">
        <canvas id="wallCanvas" width="450" height="600"></canvas>
        
        <div class="sidebar">
            <div class="panel">
                <h2>Score</h2>
                <div class="score" id="scoreDisplay">0</div>
            </div>

            <div class="panel">
                <h2>Boules Restantes</h2>
                <div class="balls-left" id="ballsDisplay">10</div>
            </div>

            <div class="panel">
                <h2>Boutique</h2>
                <div class="tabs">
                    <button class="tab-btn active" onclick="switchTab('balls')">Boules</button>
                    <button class="tab-btn" onclick="switchTab('upgrades')">Améliorations</button>
                </div>

                <div id="tab-balls" class="tab-content active">
                    <p class="instructions">1 Boule : <strong>15 pts</strong></p>
                    <button id="buy1Button" onclick="buyBalls(1, 15)">Acheter 1</button>
                    <p class="instructions" style="margin-top: 10px;">Pack de 20 boules : <strong>250 pts</strong></p>
                    <button id="buy20Button" onclick="buyBalls(20, 250)">Acheter 20</button>
                </div>

                <div id="tab-upgrades" class="tab-content">
                    <p class="instructions">Multiplicateur x2 : <strong>300 pts</strong></p>
                    <button id="buyMultiplier" onclick="buyUpgrade()">Améliorer</button>
                </div>
            </div>

            <div class="panel">
                <h2>Infos</h2>
                <p class="instructions">Le centre rapporte le plus gros score ! Attention aux barrières anti-triche en haut.</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wallCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let ballsCount = 10;
        let scoreMultiplier = 1;
        let balls = [];
        let pegs = [];
        let slots = [];
        let barriers = [];

        const rows = 8;
        const cols = 9;
        const pegRadius = 6;
        
        function initPegs() {
            pegs = [];
            for (let r = 0; r < rows; r++) {
                let numCols = (r % 2 === 0) ? cols : cols - 1;
                let startX = (r % 2 === 0) ? 50 : 75;
                for (let c = 0; c < numCols; c++) {
                    pegs.push({
                        x: startX + c * 45,
                        y: 110 + r * 50
                    });
                }
            }
        }

        // Barrières obliques en haut pour empêcher de tomber direct dans les trous
        function initBarriers() {
            barriers = [
                { x1: 0, y1: 50, x2: 90, y2: 100 },
                { x1: 450, y1: 50, x2: 360, y2: 100 }
            ];
        }

        // Fentes de score inversées : plus haut score au milieu
        function initSlots() {
            slots = [];
            const slotWidth = 450 / 7;
            const values = [5, 15, 50, 200, 50, 15, 5];
            for (let i = 0; i < 7; i++) {
                slots.push({
                    x: i * slotWidth,
                    width: slotWidth,
                    value: values[i]
                });
            }
        }

        initPegs();
        initBarriers();
        initSlots();

        class Ball {
            constructor(x) {
                this.x = x;
                this.y = 20;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.radius = 8;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                this.vy += 0.25;
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.99;

                // Collisions bords du canvas
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.5;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.5;
                }

                // Collisions avec les barrières obliques du haut
                barriers.forEach(b => {
                    let dx = b.x2 - b.x1;
                    let dy = b.y2 - b.y1;
                    let length = Math.sqrt(dx * dx + dy * dy);
                    let nx = -dy / length;
                    let ny = dx / length;

                    // Projection simple pour dévier la boule
                    let cx = this.x - b.x1;
                    let cy = this.y - b.y1;
                    let dot = (cx * dx + cy * dy) / (length * length);
                    
                    if (dot >= 0 && dot <= 1) {
                        let lineX = b.x1 + dot * dx;
                        let lineY = b.y1 + dot * dy;
                        let dist = Math.sqrt((this.x - lineX) * (this.x - lineX) + (this.y - lineY) * (this.y - lineY));
                        if (dist < this.radius) {
                            this.vx += nx * 2;
                            this.vy += ny * 2;
                            this.y = lineY + ny * this.radius;
                        }
                    }
                });

                // Collisions avec les picots
                pegs.forEach(peg => {
                    let dx = this.x - peg.x;
                    let dy = this.y - peg.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < this.radius + pegRadius) {
                        let angle = Math.atan2(dy, dx);
                        let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        let randomKick = (Math.random() - 0.5) * 3;
                        this.vx = Math.cos(angle) * speed * 0.5 + randomKick;
                        this.vy = Math.sin(angle) * speed * 0.5;

                        this.x = peg.x + Math.cos(angle) * (this.radius + pegRadius + 2);
                        this.y = peg.y + Math.sin(angle) * (this.radius + pegRadius + 2);
                    }
                });

                // Arrivée en bas
                if (this.y >= canvas.height - 40) {
                    this.active = false;
                    slots.forEach(slot => {
                        if (this.x >= slot.x && this.x < slot.x + slot.width) {
                            score += slot.value * scoreMultiplier;
                            updateUI();
                        }
                    });
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f43f5e';
                ctx.fill();
                ctx.closePath();
            }
        }

        canvas.addEventListener('click', (e) => {
            if (ballsCount > 0) {
                const rect = canvas.getBoundingClientRect();
                let dropX = e.clientX - rect.left;
                dropX = Math.max(30, Math.min(canvas.width - 30, dropX));
                
                balls.push(new Ball(dropX));
                ballsCount--;
                updateUI();
            }
        });

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            if (tabName === 'balls') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('tab-balls').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('tab-upgrades').classList.add('active');
            }
        }

        function buyBalls(amount, cost) {
            if (score >= cost) {
                score -= cost;
                ballsCount += amount;
                updateUI();
            } else {
                alert("Pas assez de points !");
            }
        }

        function buyUpgrade() {
            let cost = 300;
            if (score >= cost && scoreMultiplier === 1) {
                score -= cost;
                scoreMultiplier = 2;
                document.getElementById('buyMultiplier').innerText = "Acheté (x2)";
                document.getElementById('buyMultiplier').disabled = true;
                updateUI();
            }
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('ballsDisplay').innerText = ballsCount;
            document.getElementById('buy1Button').disabled = score < 15;
            document.getElementById('buy20Button').disabled = score < 250;
            if (scoreMultiplier === 1) {
                document.getElementById('buyMultiplier').disabled = score < 300;
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner les barrières anti-triche du haut
            ctx.strokeStyle = '#475569';
            ctx.lineWidth = 4;
            barriers.forEach(b => {
                ctx.beginPath();
                ctx.moveTo(b.x1, b.y1);
                ctx.lineTo(b.x2, b.y2);
                ctx.stroke();
                ctx.closePath();
            });
            ctx.lineWidth = 1;

            // Dessiner les picots
            ctx.fillStyle = '#94a3b8';
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, pegRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Dessiner les fentes du bas (centre mis en valeur)
            slots.forEach((slot, index) => {
                ctx.strokeStyle = '#334155';
                ctx.strokeRect(slot.x, canvas.height - 40, slot.width, 40);
                ctx.fillStyle = (index === 3) ? '#eab308' : '#64748b';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`+${slot.value}`, slot.x + slot.width / 2, canvas.height - 15);
            });

            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });

            balls = balls.filter(ball => ball.active);

            requestAnimationFrame(animate);
        }

        updateUI();
        animate();
    </script>
</body>
</html>
