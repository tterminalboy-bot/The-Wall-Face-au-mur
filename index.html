<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Le Mur - Mini Jeu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .game-container {
            display: flex;
            gap: 20px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        canvas {
            background: #090d16;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid #334155;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 220px;
        }
        .panel {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
        }
        .panel h2 {
            font-size: 1.1rem;
            margin-top: 0;
            color: #cbd5e1;
        }
        .score {
            font-size: 1.8rem;
            font-weight: bold;
            color: #4ade80;
        }
        .balls-left {
            font-size: 1.5rem;
            font-weight: bold;
            color: #facc15;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
            width: 100%;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #64748b;
            cursor: not-allowed;
        }
        .instructions {
            font-size: 0.85rem;
            color: #94a3b8;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>LE MUR</h1>
    <p style="margin-top: 0; color: #94a3b8;">Clique en haut du mur pour lacher une boule !</p>

    <div class="game-container">
        <canvas id="wallCanvas" width="450" height="600"></canvas>
        
        <div class="sidebar">
            <div class="panel">
                <h2>Score</h2>
                <div class="score" id="scoreDisplay">0</div>
            </div>

            <div class="panel">
                <h2>Boules Restantes</h2>
                <div class="balls-left" id="ballsDisplay">5</div>
            </div>

            <div class="panel">
                <h2>Boutique</h2>
                <p class="instructions">Pack de 3 boules : <strong>50 points</strong></p>
                <button id="buyButton" onclick="buyBalls()">Acheter</button>
            </div>

            <div class="panel">
                <h2>Aide</h2>
                <p class="instructions">Plus les boules tombent dans les cases extérieures, plus tu gagnes gros !</p>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('wallCanvas');
        const ctx = canvas.getContext('2d');

        let score = 0;
        let ballsCount = 5;
        let balls = [];
        let pegs = [];
        let slots = [];

        // Configuration du mur
        const rows = 8;
        const cols = 9;
        const pegRadius = 6;
        
        // Initialisation des picots
        function initPegs() {
            pegs = [];
            for (let r = 0; r < rows; r++) {
                let numCols = (r % 2 === 0) ? cols : cols - 1;
                let startX = (r % 2 === 0) ? 50 : 75;
                for (let c = 0; c < numCols; c++) {
                    pegs.push({
                        x: startX + c * 45,
                        y: 80 + r * 50
                    });
                }
            }
        }

        // Initialisation des fentes de score en bas
        function initSlots() {
            slots = [];
            const slotWidth = 450 / 7;
            const values = [100, 25, 10, 5, 10, 25, 100];
            for (let i = 0; i < 7; i++) {
                slots.push({
                    x: i * slotWidth,
                    width: slotWidth,
                    value: values[i]
                });
            }
        }

        initPegs();
        initSlots();

        // Classe Boule
        class Ball {
            constructor(x) {
                this.x = x;
                this.y = 20;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = 0;
                this.radius = 8;
                this.active = true;
            }

            update() {
                if (!this.active) return;

                // Gravité
                this.vy += 0.25;
                this.x += this.vx;
                this.y += this.vy;

                // Friction / résistance de l'air
                this.vx *= 0.99;

                // Collisions avec les bords du canvas
                if (this.x - this.radius < 0) {
                    this.x = this.radius;
                    this.vx *= -0.5;
                }
                if (this.x + this.radius > canvas.width) {
                    this.x = canvas.width - this.radius;
                    this.vx *= -0.5;
                }

                // Collisions avec les picots
                pegs.forEach(peg => {
                    let dx = this.x - peg.x;
                    let dy = this.y - peg.y;
                    let dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < this.radius + pegRadius) {
                        // Rebond et orientation aléatoire (gauche ou droite)
                        let angle = Math.atan2(dy, dx);
                        let speed = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
                        
                        // Petit coup de pouce aléatoire vers la gauche ou la droite
                        let randomKick = (Math.random() - 0.5) * 3;
                        this.vx = Math.cos(angle) * speed * 0.5 + randomKick;
                        this.vy = Math.sin(angle) * speed * 0.5;

                        // Éviter de rester collé au picot
                        this.x = peg.x + Math.cos(angle) * (this.radius + pegRadius + 2);
                        this.y = peg.y + Math.sin(angle) * (this.radius + pegRadius + 2);
                    }
                });

                // Vérification si la boule atteint le fond (les fentes)
                if (this.y >= canvas.height - 40) {
                    this.active = false;
                    // Trouver la fente correspondante
                    slots.forEach(slot => {
                        if (this.x >= slot.x && this.x < slot.x + slot.width) {
                            score += slot.value;
                            updateUI();
                        }
                    });
                }
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = '#f43f5e';
                ctx.fill();
                ctx.closePath();
            }
        }

        // Clic sur le canvas pour lâcher une boule
        canvas.addEventListener('click', (e) => {
            if (ballsCount > 0) {
                const rect = canvas.getBoundingClientRect();
                let dropX = e.clientX - rect.left;
                // S'assurer que la boule tombe dans les limites du mur
                dropX = Math.max(20, Math.min(canvas.width - 20, dropX));
                
                balls.push(new Ball(dropX));
                ballsCount--;
                updateUI();
            }
        });

        function buyBalls() {
            if (score >= 50) {
                score -= 50;
                ballsCount += 3;
                updateUI();
            } else {
                alert("Pas assez de points !");
            }
        }

        function updateUI() {
            document.getElementById('scoreDisplay').innerText = score;
            document.getElementById('ballsDisplay').innerText = ballsCount;
            document.getElementById('buyButton').disabled = score < 50;
        }

        // Boucle principale du jeu
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Dessiner les picots
            ctx.fillStyle = '#94a3b8';
            pegs.forEach(peg => {
                ctx.beginPath();
                ctx.arc(peg.x, peg.y, pegRadius, 0, Math.PI * 2);
                ctx.fill();
                ctx.closePath();
            });

            // Dessiner les fentes du bas
            slots.forEach((slot, index) => {
                ctx.strokeStyle = '#334155';
                ctx.strokeRect(slot.x, canvas.height - 40, slot.width, 40);
                ctx.fillStyle = index === 0 || index === slots.length - 1 ? '#eab308' : '#64748b';
                ctx.font = 'bold 12px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(`+${slot.value}`, slot.x + slot.width / 2, canvas.height - 15);
            });

            // Mettre à jour et dessiner les boules
            balls.forEach(ball => {
                ball.update();
                ball.draw();
            });

            // Nettoyer les boules inactives pour optimiser
            balls = balls.filter(ball => ball.active);

            requestAnimationFrame(animate);
        }

        updateUI();
        animate();
    </script>
</body>
</html>
